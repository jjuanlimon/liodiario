# Configuración del panel Pages CMS (app.pagescms.org)
media:
  input: public/images/noticias
  output: /images/noticias

content:
  - name: noticias
    label: Noticias
    type: collection
    path: src/content/noticias
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, category, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titular
        type: string
        required: true
      - name: description
        label: "Resumen corto (sale debajo del titular y en WhatsApp)"
        type: text
      - name: date
        label: Fecha
        type: date
        required: true
      - name: category
        label: Categoría
        type: select
        required: true
        options:
          values: [Política, Deportes, Farándula, Entretenimiento, Actualidad]
      - name: image
        label: "Foto principal (horizontal queda mejor)"
        type: image
      - name: imageAlt
        label: "Descripción de la foto (para personas ciegas y Google)"
        type: string
      - name: video
        label: "Enlace de video de YouTube (opcional, se muestra en vez de la foto)"
        type: string
      - name: real
        label: "¿Es una NOTICIA REAL? (apagado = sátira inventada)"
        type: boolean
        default: false
      - name: source
        label: "Fuente de la noticia real (ej.: Diario Libre). Escríbela con tus palabras, no copies."
        type: string
      - name: sourceUrl
        label: "Enlace a la noticia original (opcional)"
        type: string
      - name: featured
        label: "¿Poner como noticia principal de la portada?"
        type: boolean
        default: false
      - name: body
        label: Texto de la noticia
        type: rich-text
